# Publishes the project website (site/ plus screenshots and llms.txt) to
# GitHub Pages whenever it changes on main.
name: Website

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs/screenshots/**'
      - 'docs/assets/**'
      - 'llms.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r docs/screenshots _site/screenshots
          cp -r docs/assets _site/assets
          cp llms.txt _site/llms.txt

      - name: Upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
