# Keeps dependencies current with a small number of grouped pull requests.
# Yarn 4 (Berry) is handled by the "npm" ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      # twenty-sdk, twenty-client-sdk and twenty-ui must move together and match
      # the Twenty server version the app targets.
      twenty:
        patterns:
          - "twenty-*"
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - "twenty-*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /integrations/home-assistant
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
